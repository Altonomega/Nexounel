# Nexounel CI + release.
#
# Runs on GitHub Actions (github.com/Altonomega/Nexounel) and on Forgejo
# Actions (Forgejo 17.0.1 at https://time.plutus.bond:8444/mashani/Nexounel)
# — the two share the same workflow YAML format. Forgejo needs a runner
# registered before the workflow can run there; see CI-RELEASE.md.
#
# Gates (the same gates TARS uses before any deploy):
#   go vet ./...   (static checks)
#   go build ./... (everything compiles)
#   go test ./...  (full suite)
#
# Known pre-existing failures (environment-only, sandbox):
# The 9 tests below fail in the restricted sandbox (no IPv6, UDP
# intercepted by the egress proxy) and are documented as environment-only
# in CI-RELEASE.md. They are expected to PASS on a standard runner
# (GitHub-hosted ubuntu-latest, or a Forgejo runner with full network),
# which has IPv6 loopback and unrestricted UDP. If they fail in CI, the
# runner environment is restricted — investigate, do not ignore.
#   TestEncryptedSessionHandshakeAfterReset
#   TestAsyncWriterUsesIPv6Socket
#   TestExchangeUDPQueryWithConnDrainsStaleResponsesBeforeSending
#   TestExchangeUDPQueryWithConnFailsAfterTooManyMismatches
#   TestExchangeUDPQueryWithConnReturnsMatchingResponseAfterMismatches
#   TestIPv6TunnelSocketCarriesDNSDatagram
#   TestProbeExchangeSkipsForgedNXDOMAIN
#   TestQueryOneUpstreamRetriesTruncatedUDPOverTCP
#   TestReusePortSocketsShareReplyAddress
#
# Release (tag push v*):
# The version comes from the git tag (e.g. v0.4.0) and is stamped into
# the binaries at link time via -ldflags -X .../version.BuildVersion.
# The release tarball + offline bundle are built by the existing
# deterministic scripts (install/package-release.sh,
# install/package-offline-bundle.sh), SHA-256-summed, uploaded as
# workflow artifacts, and (when the FORGEJO_TOKEN secret is set)
# published to a Forgejo release. No binary is ever released with
# BuildVersion "dev".

name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: vet + build + test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: core/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  release:
    name: release tarball + offline bundle
    runs-on: ubuntu-latest
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: core/go.sum

      - name: Build release tarball + offline bundle
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p dist
          bash install/package-release.sh --version "$VERSION" --out dist/
          bash install/package-offline-bundle.sh --version "$VERSION" --out dist/
          echo "=== artifacts ==="
          ls -la dist/
          echo "=== checksums ==="
          (cd dist && sha256sum -c *.sha256)

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nexounel-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

      - name: Publish to Forgejo release
        if: env.FORGEJO_TOKEN != ''
        env:
          FORGEJO_TOKEN: ${{ secrets.FORGEJO_TOKEN }}
          FORGEJO_URL: ${{ vars.FORGEJO_URL }}
          FORGEJO_REPO: ${{ vars.FORGEJO_REPO }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/release/forgejo-publish.py \
            --version "$VERSION" --dist dist/
